<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
            color: #ffffff;
        }
        .fade-in {
            animation: fadeIn 1.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <main class="text-center fade-in">
        <!-- Un logo simple o icono discreto -->
        <div class="mb-8 flex justify-center">
            <div class="w-12 h-12 border border-white/20 rounded-full flex items-center justify-center">
                <div class="w-2 h-2 bg-white rounded-full animate-pulse"></div>
            </div>
        </div>

        <h1 class="text-2xl md:text-3xl font-light tracking-widest uppercase mb-4">
            Espacio Privado
        </h1>
        
        <div class="w-16 h-px bg-white/20 mx-auto mb-6"></div>

        <p class="text-slate-400 text-sm md:text-base max-w-sm mx-auto leading-relaxed font-light">
            Este servidor se utiliza para fines de desarrollo y pruebas. 
            No hay contenido público disponible en este directorio.
        </p>

        <footer class="mt-12">
            <p class="text-xs text-slate-600 uppercase tracking-widest">
                &copy; 2024 &bull; Terminal de Red
            </p>
        </footer>
    </main>

</body>
</html>
