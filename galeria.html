<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#002349">
  <title>Galeria del Festival Inmobiliario de Las Terrenas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1a1a1a;
      --muted: #555;
      --line: #dce9ea;
      --paper: #fff;
      --soft: #f5faf9;
      --navy: #002349;
      --teal: #00afad;
      --teal-dark: #008f8d;
      --danger: #b42318;
      --shadow: 0 18px 55px rgba(0, 35, 73, .12);
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #ffffff 0%, #f4fbfa 38%, #ffffff 100%);
      color: var(--ink);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(255, 255, 255, .92);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(18px);
    }

    .topbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 74px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .mark {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      border-radius: 8px;
      background: var(--navy);
      color: #fff;
      font-family: "Playfair Display", serif;
      font-size: 25px;
      font-weight: 800;
      line-height: 1;
      box-shadow: 0 8px 24px rgba(0, 35, 73, .18);
    }

    .brand small {
      display: block;
      color: var(--teal-dark);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .brand strong {
      display: block;
      max-width: 52vw;
      overflow: hidden;
      color: var(--navy);
      font-size: 16px;
      font-weight: 800;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn,
    .pill-btn,
    .view-btn,
    .chip {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--navy);
      font-weight: 800;
      transition: transform .16s ease, border-color .16s ease, background .16s ease, color .16s ease;
    }

    .icon-btn {
      display: grid;
      place-items: center;
      width: 42px;
      padding: 0;
    }

    .pill-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 14px;
      white-space: nowrap;
    }

    .primary {
      border-color: var(--teal);
      background: var(--teal);
      color: #fff;
    }

    .icon-btn:hover,
    .pill-btn:hover,
    .view-btn:hover,
    .chip:hover {
      transform: translateY(-1px);
      border-color: var(--teal);
    }

    .hero {
      padding: 48px 0 22px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
      gap: 28px;
      align-items: end;
    }

    h1 {
      max-width: 760px;
      margin: 0;
      color: var(--navy);
      font-family: "Playfair Display", serif;
      font-size: clamp(42px, 7vw, 76px);
      line-height: .94;
    }

    .lead {
      max-width: 680px;
      margin: 18px 0 0;
      color: var(--muted);
      font-size: clamp(16px, 2vw, 19px);
      line-height: 1.6;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .82);
      box-shadow: var(--shadow);
    }

    .stat {
      padding: 14px;
      border-radius: 8px;
      background: var(--soft);
    }

    .stat strong {
      display: block;
      color: var(--navy);
      font-size: 26px;
      font-weight: 900;
    }

    .stat span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .controls {
      position: sticky;
      top: 74px;
      z-index: 20;
      padding: 14px 0;
      background: rgba(245, 250, 249, .9);
      border-block: 1px solid rgba(220, 233, 234, .78);
      backdrop-filter: blur(16px);
    }

    .control-panel {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto auto;
      gap: 10px;
      align-items: center;
    }

    .search {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      height: 46px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .search input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      color: var(--ink);
      background: transparent;
    }

    .view-switch {
      display: flex;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .view-btn {
      min-width: 42px;
      border-color: transparent;
      background: transparent;
      padding: 0 10px;
    }

    .view-btn.active {
      background: var(--navy);
      color: #fff;
    }

    .chips {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: thin;
    }

    .chip {
      flex: 0 0 auto;
      padding: 0 12px;
      font-size: 13px;
    }

    .chip.active {
      border-color: var(--teal);
      background: var(--teal);
      color: #fff;
    }

    .selection-bar {
      position: fixed;
      left: 50%;
      bottom: 18px;
      z-index: 35;
      display: none;
      align-items: center;
      gap: 8px;
      width: min(680px, calc(100% - 28px));
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .96);
      box-shadow: var(--shadow);
      transform: translateX(-50%);
      backdrop-filter: blur(16px);
    }

    .selection-bar.visible {
      display: flex;
    }

    .selection-bar strong {
      flex: 1;
      color: var(--navy);
      font-size: 14px;
    }

    .gallery-wrap {
      padding: 24px 0 70px;
    }

    .gallery {
      display: grid;
      gap: 14px;
    }

    .gallery.grid {
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    }

    .gallery.masonry {
      display: block;
      columns: 4 230px;
      column-gap: 14px;
    }

    .gallery.film {
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    }

    .photo-card {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 8px 24px rgba(0, 35, 73, .08);
      break-inside: avoid;
    }

    .masonry .photo-card {
      margin: 0 0 14px;
    }

    .photo-button {
      display: block;
      width: 100%;
      padding: 0;
      border: 0;
      background: #edf6f5;
      text-align: left;
    }

    .photo-card img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      transition: transform .35s ease;
    }

    .film .photo-card img {
      aspect-ratio: 16 / 10;
    }

    .masonry .photo-card img {
      aspect-ratio: auto;
      min-height: 190px;
    }

    .photo-card:hover img {
      transform: scale(1.035);
    }

    .photo-meta {
      display: grid;
      gap: 7px;
      padding: 11px;
    }

    .photo-title {
      overflow: hidden;
      color: var(--navy);
      font-size: 14px;
      font-weight: 850;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .photo-sub {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    .card-actions {
      position: absolute;
      top: 9px;
      right: 9px;
      display: flex;
      gap: 6px;
      opacity: 0;
      transition: opacity .18s ease;
    }

    .photo-card:hover .card-actions,
    .photo-card:focus-within .card-actions {
      opacity: 1;
    }

    .card-actions .icon-btn,
    .select-toggle {
      width: 36px;
      height: 36px;
      min-height: 36px;
      border-color: rgba(255, 255, 255, .85);
      background: rgba(255, 255, 255, .92);
      box-shadow: 0 8px 22px rgba(0, 35, 73, .16);
    }

    .select-toggle {
      position: absolute;
      top: 9px;
      left: 9px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      color: var(--navy);
      font-weight: 900;
    }

    .photo-card.selected {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(0, 175, 173, .22), 0 12px 28px rgba(0, 35, 73, .1);
    }

    .photo-card.selected .select-toggle {
      background: var(--teal);
      color: #fff;
    }

    .empty {
      display: none;
      padding: 44px 18px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--muted);
      text-align: center;
    }

    .empty.visible {
      display: block;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      background: rgba(0, 23, 48, .9);
      color: #fff;
    }

    .lightbox.open {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
    }

    .lightbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px;
      background: rgba(0, 18, 38, .72);
      backdrop-filter: blur(14px);
    }

    .light-title {
      flex: 1;
      min-width: 0;
    }

    .light-title strong,
    .light-title span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .light-title strong {
      font-size: 15px;
      font-weight: 850;
    }

    .light-title span {
      margin-top: 2px;
      color: rgba(255, 255, 255, .72);
      font-size: 12px;
    }

    .lightbar .icon-btn,
    .lightbar .pill-btn {
      border-color: rgba(255, 255, 255, .16);
      background: rgba(255, 255, 255, .1);
      color: #fff;
    }

    .stage {
      position: relative;
      display: grid;
      place-items: center;
      overflow: auto;
      padding: 18px;
    }

    .stage img {
      display: block;
      max-width: 100%;
      max-height: 100%;
      border-radius: 8px;
      object-fit: contain;
      box-shadow: 0 20px 70px rgba(0, 0, 0, .35);
      transform: scale(var(--zoom, 1));
      transform-origin: center center;
      transition: transform .15s ease;
    }

    .nav-arrow {
      position: absolute;
      top: 50%;
      width: 46px;
      height: 56px;
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 8px;
      background: rgba(255, 255, 255, .11);
      color: #fff;
      font-size: 34px;
      transform: translateY(-50%);
      backdrop-filter: blur(8px);
    }

    .nav-arrow.prev {
      left: 16px;
    }

    .nav-arrow.next {
      right: 16px;
    }

    .zoom-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      background: rgba(0, 18, 38, .72);
      backdrop-filter: blur(14px);
    }

    .zoom-bar input {
      flex: 1;
      accent-color: var(--teal);
    }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 60;
      display: none;
      max-width: min(360px, calc(100% - 36px));
      padding: 12px 14px;
      border-radius: 8px;
      background: var(--navy);
      color: #fff;
      box-shadow: var(--shadow);
      font-size: 14px;
      font-weight: 750;
    }

    .toast.visible {
      display: block;
    }

    .toast a {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      margin-top: 10px;
      padding: 0 10px;
      border-radius: 8px;
      background: var(--teal);
      color: #fff;
      font-weight: 850;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
    }

    @media (max-width: 860px) {
      .topbar-inner {
        min-height: 66px;
      }

      .hero {
        padding-top: 32px;
      }

      .hero-grid {
        grid-template-columns: 1fr;
      }

      .stats {
        width: min(420px, 100%);
      }

      .controls {
        top: 66px;
      }

      .control-panel {
        grid-template-columns: 1fr;
      }

      .view-switch,
      .control-panel .pill-btn {
        width: 100%;
      }

      .view-btn {
        flex: 1;
      }

      .card-actions {
        opacity: 1;
      }
    }

    @media (max-width: 620px) {
      .shell {
        width: min(100% - 22px, 1180px);
      }

      .brand strong {
        max-width: 58vw;
        font-size: 14px;
      }

      .brand small {
        font-size: 10px;
      }

      .mark {
        width: 40px;
        height: 40px;
        font-size: 22px;
      }

      .nav-actions .pill-btn {
        display: none;
      }

      .gallery.grid,
      .gallery.film {
        grid-template-columns: 1fr;
      }

      .gallery.masonry {
        columns: 1;
      }

      .selection-bar {
        align-items: stretch;
        flex-wrap: wrap;
      }

      .selection-bar strong {
        flex-basis: 100%;
      }

      .selection-bar .pill-btn {
        flex: 1;
      }

      .lightbar {
        flex-wrap: wrap;
      }

      .light-title {
        flex-basis: 100%;
        order: -1;
      }

      .stage {
        padding: 8px;
      }

      .nav-arrow {
        width: 38px;
        height: 48px;
        font-size: 28px;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="shell topbar-inner">
      <a class="brand" href="index.html" aria-label="Volver al inicio">
        <!-- <span class="mark">1</span> -->
         <div class="navbar-logo">
                <img src="logo.png" style="height: 50px;"> 
            </div>
        <span>
          <small>Festival Inmobiliario</small>
          <strong>Galeria Las Terrenas</strong>
        </span>
      </a>
      <div class="nav-actions">
        <!-- <button class="pill-btn" id="sharePageBtn" type="button">Compartir galeria</button> -->
        <a class="pill-btn primary" href="index.html">Sitio principal</a>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="shell hero-grid">
        <div>
          <h1>Momentos del Festival</h1>
          <p class="lead">Una coleccion visual del 1er Festival Inmobiliario de Las Terrenas, lista para explorar, compartir y descargar en alta calidad.</p>
        </div>
        <div class="stats" aria-label="Resumen de la galeria">
          <div class="stat">
            <strong id="totalCount">0</strong>
            <span>Fotos</span>
          </div>
          <div class="stat">
            <strong id="groupCount">0</strong>
            <span>Grupos</span>
          </div>
        </div>
      </div>
    </section>

    <section class="controls" aria-label="Controles de galeria">
      <div class="shell">
        <div class="control-panel">
          <label class="search">
            <span aria-hidden="true">Buscar</span>
            <input id="searchInput" type="search" placeholder="Nombre, grupo o archivo">
          </label>
          <div class="view-switch" role="group" aria-label="Cambiar vista">
            <button class="view-btn active" type="button" data-view="grid" title="Vista cuadricula">Grid</button>
            <button class="view-btn" type="button" data-view="masonry" title="Vista mosaico">Mosaico</button>
            <button class="view-btn" type="button" data-view="film" title="Vista amplia">Amplia</button>
          </div>
          <button class="pill-btn" id="clearBtn" type="button">Limpiar</button>
        </div>
        <div class="chips" id="groupChips" aria-label="Grupos de fotos"></div>
      </div>
    </section>

    <section class="gallery-wrap">
      <div class="shell">
        <div class="gallery grid" id="gallery"></div>
        <div class="empty" id="emptyState">No hay fotos para mostrar.</div>
      </div>
    </section>
  </main>

  <div class="selection-bar" id="selectionBar">
    <strong id="selectionText">0 seleccionadas</strong>
    <button class="pill-btn" id="shareSelectionBtn" type="button">Compartir seleccion</button>
    <button class="pill-btn" id="downloadSelectionBtn" type="button">Descargar</button>
    <button class="pill-btn" id="clearSelectionBtn" type="button">Quitar</button>
  </div>

  <section class="lightbox" id="lightbox" aria-modal="true" role="dialog" aria-label="Vista de imagen">
    <div class="lightbar">
      <div class="light-title">
        <strong id="lightTitle"></strong>
        <span id="lightSubtitle"></span>
      </div>
      <button class="pill-btn" id="lightShareBtn" type="button">Compartir</button>
      <a class="pill-btn primary" id="lightDownloadBtn" href="#" target="_blank" rel="noopener">Descargar full-res</a>
      <button class="icon-btn" id="lightCloseBtn" type="button" aria-label="Cerrar">X</button>
    </div>
    <div class="stage" id="stage">
      <button class="nav-arrow prev" id="prevBtn" type="button" aria-label="Imagen anterior">‹</button>
      <img id="lightImage" alt="">
      <button class="nav-arrow next" id="nextBtn" type="button" aria-label="Imagen siguiente">›</button>
    </div>
    <div class="zoom-bar">
      <button class="icon-btn" id="zoomOutBtn" type="button" aria-label="Alejar">-</button>
      <input id="zoomRange" type="range" min="1" max="3" step=".1" value="1" aria-label="Zoom">
      <button class="icon-btn" id="zoomInBtn" type="button" aria-label="Acercar">+</button>
      <button class="pill-btn" id="zoomResetBtn" type="button">100%</button>
    </div>
  </section>

  <div class="toast" id="toast"></div>

,{"id":"img-4504-e491494","title":"IMG 4504","fileName":"IMG_4504.jpg","group":"Festival Fedex","size":2456441,"displayUrl":"https://i.ibb.co/Pvyw3myj/img-4504-e491494.jpg","thumbUrl":"https://i.ibb.co/ksTQkHTB/img-4504-e491494.jpg","downloadUrl":"https://drive.google.com/uc?export=download&id=1dsN2bX6z0CBqqnp4m4EsRzmrlNWNOnuJ","fallbackUrl":"https://i.ibb.co/Pvyw3myj/img-4504-e491494.jpg","driveUrl":"https://drive.google.com/uc?export=download&id=1dsN2bX6z0CBqqnp4m4EsRzmrlNWNOnuJ","imgbbUrl":"https://i.ibb.co/4nLP9mLt/img-4504-e491494.jpg","sourceKey":"Festival Fedex/IMG_4504.jpg"},{"id":"img-4505-8fbe13f","title":"IMG 4505","fileName":"IMG_4505.jpg","group":"Festival Fedex","size":2927575,"displayUrl":"https://i.ibb.co/0pYfjmfz/img-4505-8fbe13f.jpg","thumbUrl":"https://i.ibb.co/V0MvWJvk/img-4505-8fbe13f.jpg","downloadUrl":"https://drive.google.com/uc?export=download&id=1baer15mRPgCWNSPCxiQ8fPg0xwLeg27M","fallbackUrl":"https://i.ibb.co/0pYfjmfz/img-4505-8fbe13f.jpg","driveUrl":"https://drive.google.com/uc?export=download&id=1baer15mRPgCWNSPCxiQ8fPg0xwLeg27M","imgbbUrl":"https://i.ibb.co/gbtDMmDc/img-4505-8fbe13f.jpg","sourceKey":"Festival Fedex/IMG_4505.jpg"},{"id":"img-4506-e80d782","title":"IMG 4506","fileName":"IMG_4506.jpg","group":"Festival Fedex","size":2207252,"displayUrl":"https://i.ibb.co/GQG6Xp1q/img-4506-e80d782.jpg","thumbUrl":"https://i.ibb.co/gZQ2G9Xx/img-4506-e80d782.jpg","downloadUrl":"https://drive.google.com/uc?export=download&id=1RwG7UVAYXigqCbO9DHJx_lBXkBzrQ1nX","fallbackUrl":"https://i.ibb.co/GQG6Xp1q/img-4506-e80d782.jpg","driveUrl":"https://drive.google.com/uc?export=download&id=1RwG7UVAYXigqCbO9DHJx_lBXkBzrQ1nX","imgbbUrl":"https://i.ibb.co/4RCqctDH/img-4506-e80d782.jpg","sourceKey":"Festival Fedex/IMG_4506.jpg"},{"id":"img-4507-037ab07","title":"IMG 4507","fileName":"IMG_4507.jpg","group":"Festival Fedex","size":2286456,"displayUrl":"https://i.ibb.co/vx6Wr1Yw/img-4507-037ab07.jpg","thumbUrl":"https://i.ibb.co/SX4g1Nrs/img-4507-037ab07.jpg",       // __GALLERY_DATA_END__
  </script>
  <script>
    const data = window.GALLERY_DATA || { images: [], groups: [] };
    const images = Array.isArray(data.images) ? data.images : [];
    const state = {
      view: localStorage.getItem("festivalGalleryView") || "grid",
      group: "Todos",
      query: "",
      filtered: [],
      selected: new Set(),
      currentId: "",
      zoom: 1
    };

    const els = {
      totalCount: document.querySelector("#totalCount"),
      groupCount: document.querySelector("#groupCount"),
      gallery: document.querySelector("#gallery"),
      empty: document.querySelector("#emptyState"),
      chips: document.querySelector("#groupChips"),
      search: document.querySelector("#searchInput"),
      clear: document.querySelector("#clearBtn"),
      viewButtons: [...document.querySelectorAll(".view-btn")],
      selectionBar: document.querySelector("#selectionBar"),
      selectionText: document.querySelector("#selectionText"),
      sharePage: document.querySelector("#sharePageBtn"),
      shareSelection: document.querySelector("#shareSelectionBtn"),
      downloadSelection: document.querySelector("#downloadSelectionBtn"),
      clearSelection: document.querySelector("#clearSelectionBtn"),
      lightbox: document.querySelector("#lightbox"),
      lightTitle: document.querySelector("#lightTitle"),
      lightSubtitle: document.querySelector("#lightSubtitle"),
      lightImage: document.querySelector("#lightImage"),
      lightDownload: document.querySelector("#lightDownloadBtn"),
      lightShare: document.querySelector("#lightShareBtn"),
      lightClose: document.querySelector("#lightCloseBtn"),
      prev: document.querySelector("#prevBtn"),
      next: document.querySelector("#nextBtn"),
      zoomRange: document.querySelector("#zoomRange"),
      zoomIn: document.querySelector("#zoomInBtn"),
      zoomOut: document.querySelector("#zoomOutBtn"),
      zoomReset: document.querySelector("#zoomResetBtn"),
      toast: document.querySelector("#toast")
    };

    const groups = ["Todos", ...new Set(images.map((image) => image.group).filter(Boolean))];

    function formatSize(bytes) {
      if (!bytes) return "";
      const mb = bytes / 1024 / 1024;
      return `${mb.toFixed(mb >= 10 ? 0 : 1)} MB`;
    }

    function imageById(id) {
      return images.find((image) => image.id === id);
    }

    function filteredIndex() {
      return state.filtered.findIndex((image) => image.id === state.currentId);
    }

    function makeUrl(params) {
      const url = new URL(window.location.href);
      url.search = "";
      Object.entries(params).forEach(([key, value]) => {
        if (value) url.searchParams.set(key, value);
      });
      return url.toString();
    }

    async function shareUrl(url, title = "Galeria del Festival") {
      try {
        if (navigator.share) {
          await navigator.share({ title, url });
        } else {
          await navigator.clipboard.writeText(url);
          toast("Enlace copiado");
        }
      } catch {
        toast("No se pudo compartir");
      }
    }

    function toast(message, action) {
      els.toast.textContent = "";
      const text = document.createElement("div");
      text.textContent = message;
      els.toast.append(text);
      if (action?.url) {
        const link = document.createElement("a");
        link.href = action.url;
        link.target = "_blank";
        link.rel = "noopener";
        link.textContent = action.label || "Abrir respaldo";
        els.toast.append(link);
      }
      els.toast.classList.add("visible");
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => els.toast.classList.remove("visible"), action?.url ? 8000 : 2200);
    }

    function openDownload(image) {
      if (!image) return;
      const primary = image.downloadUrl || image.displayUrl;
      const fallback = image.fallbackUrl || image.imgbbUrl || image.displayUrl;
      if (!primary) return;
      const opened = window.open(primary, "_blank", "noopener");
      if (!opened) window.location.href = primary;
      if (fallback && fallback !== primary) {
        toast("Descarga iniciada desde Drive. Respaldo listo por si Google bloquea el archivo.", {
          label: "Abrir ImgBB",
          url: fallback
        });
      } else {
        toast("Descarga iniciada");
      }
    }

    function applyQueryParams() {
      const params = new URLSearchParams(location.search);
      const group = params.get("grupo");
      const selection = params.get("seleccion");
      const photo = params.get("foto");
      if (group && groups.includes(group)) state.group = group;
      if (selection) {
        selection.split(",").map((id) => id.trim()).filter(Boolean).forEach((id) => {
          if (imageById(id)) state.selected.add(id);
        });
      }
      render();
      if (photo && imageById(photo)) openLightbox(photo, false);
    }

    function renderChips() {
      els.chips.innerHTML = groups.map((group) => {
        const count = group === "Todos" ? images.length : images.filter((image) => image.group === group).length;
        return `<button class="chip ${group === state.group ? "active" : ""}" type="button" data-group="${escapeHtml(group)}">${escapeHtml(group)} · ${count}</button>`;
      }).join("");

      els.chips.querySelectorAll(".chip").forEach((chip) => {
        chip.addEventListener("click", () => {
          state.group = chip.dataset.group;
          render();
          history.replaceState(null, "", state.group === "Todos" ? location.pathname : makeUrl({ grupo: state.group }));
        });
      });
    }

    function render() {
      const q = state.query.trim().toLowerCase();
      state.filtered = images.filter((image) => {
        const inGroup = state.group === "Todos" || image.group === state.group;
        const haystack = `${image.title} ${image.fileName} ${image.group}`.toLowerCase();
        return inGroup && (!q || haystack.includes(q));
      });

      els.totalCount.textContent = images.length;
      els.groupCount.textContent = Math.max(groups.length - 1, 0);
      els.gallery.className = `gallery ${state.view}`;
      els.viewButtons.forEach((button) => button.classList.toggle("active", button.dataset.view === state.view));
      renderChips();
      renderCards();
      renderSelection();
    }

    function renderCards() {
      els.empty.classList.toggle("visible", state.filtered.length === 0);
      els.gallery.innerHTML = state.filtered.map((image) => {
        const selected = state.selected.has(image.id);
        return `
          <article class="photo-card ${selected ? "selected" : ""}" data-id="${escapeHtml(image.id)}">
            <button class="select-toggle" type="button" data-action="select" aria-label="Seleccionar ${escapeHtml(image.title)}">${selected ? "OK" : "+"}</button>
            <button class="photo-button" type="button" data-action="open">
              <img loading="lazy" decoding="async" src="${escapeAttr(image.thumbUrl || image.displayUrl)}" alt="${escapeAttr(image.title)}">
            </button>
            <div class="card-actions">
              <button class="icon-btn" type="button" data-action="share" title="Compartir">SH</button>
              <a class="icon-btn" href="${escapeAttr(image.downloadUrl)}" target="_blank" rel="noopener" data-action="download" title="Descargar">DL</a>
            </div>
            <div class="photo-meta">
              <div class="photo-title">${escapeHtml(image.title)}</div>
              <div class="photo-sub"><span>${escapeHtml(image.group)}</span><span>${formatSize(image.size)}</span></div>
            </div>
          </article>
        `;
      }).join("");
    }

    function renderSelection() {
      const count = state.selected.size;
      els.selectionText.textContent = `${count} seleccionada${count === 1 ? "" : "s"}`;
      els.selectionBar.classList.toggle("visible", count > 0);
    }

    function toggleSelected(id) {
      if (state.selected.has(id)) state.selected.delete(id);
      else state.selected.add(id);
      renderCards();
      renderSelection();
    }

    function openLightbox(id, push = true) {
      const image = imageById(id);
      if (!image) return;
      state.currentId = id;
      setZoom(1);
      els.lightTitle.textContent = image.title;
      els.lightSubtitle.textContent = `${image.group} · ${image.fileName}`;
      els.lightImage.src = image.displayUrl;
      els.lightImage.alt = image.title;
      els.lightDownload.href = image.downloadUrl;
      els.lightbox.classList.add("open");
      document.body.style.overflow = "hidden";
      if (push) history.replaceState(null, "", makeUrl({ foto: id }));
    }

    function closeLightbox() {
      els.lightbox.classList.remove("open");
      els.lightImage.removeAttribute("src");
      document.body.style.overflow = "";
      history.replaceState(null, "", state.group === "Todos" ? location.pathname : makeUrl({ grupo: state.group }));
    }

    function moveLightbox(direction) {
      if (!state.filtered.length) return;
      const index = filteredIndex();
      const nextIndex = (index + direction + state.filtered.length) % state.filtered.length;
      openLightbox(state.filtered[nextIndex].id);
    }

    function setZoom(value) {
      state.zoom = Math.max(1, Math.min(3, Number(value)));
      els.zoomRange.value = state.zoom;
      els.lightImage.style.setProperty("--zoom", state.zoom);
      els.zoomReset.textContent = `${Math.round(state.zoom * 100)}%`;
    }

    function downloadSelected() {
      const ids = [...state.selected];
      if (!ids.length) return;
      ids.forEach((id, index) => {
        const image = imageById(id);
        if (!image) return;
        setTimeout(() => openDownload(image), index * 240);
      });
      toast("Abriendo descargas");
    }

    function escapeHtml(value = "") {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#039;"
      }[char]));
    }

    function escapeAttr(value = "") {
      return escapeHtml(value);
    }

    els.gallery.addEventListener("click", (event) => {
      const card = event.target.closest(".photo-card");
      if (!card) return;
      const id = card.dataset.id;
      const action = event.target.closest("[data-action]")?.dataset.action;
      if (action === "select") toggleSelected(id);
      if (action === "open") openLightbox(id);
      if (action === "share") shareUrl(makeUrl({ foto: id }), imageById(id)?.title || "Foto del Festival");
      if (action === "download") {
        event.preventDefault();
        openDownload(imageById(id));
      }
    });

    els.viewButtons.forEach((button) => {
      button.addEventListener("click", () => {
        state.view = button.dataset.view;
        localStorage.setItem("festivalGalleryView", state.view);
        render();
      });
    });

    els.search.addEventListener("input", () => {
      state.query = els.search.value;
      render();
    });

    els.clear.addEventListener("click", () => {
      state.group = "Todos";
      state.query = "";
      els.search.value = "";
      history.replaceState(null, "", location.pathname);
      render();
    });

    if (els.sharePage) {
      els.sharePage.addEventListener("click", () => {
        const params = state.group === "Todos" ? {} : { grupo: state.group };
        shareUrl(makeUrl(params));
      });
    }

    els.shareSelection.addEventListener("click", () => {
      shareUrl(makeUrl({ seleccion: [...state.selected].join(",") }), "Seleccion de fotos");
    });

    els.downloadSelection.addEventListener("click", downloadSelected);
    els.clearSelection.addEventListener("click", () => {
      state.selected.clear();
      renderCards();
      renderSelection();
    });

    els.lightClose.addEventListener("click", closeLightbox);
    els.prev.addEventListener("click", () => moveLightbox(-1));
    els.next.addEventListener("click", () => moveLightbox(1));
    els.lightShare.addEventListener("click", () => shareUrl(makeUrl({ foto: state.currentId }), imageById(state.currentId)?.title || "Foto del Festival"));
    els.lightDownload.addEventListener("click", (event) => {
      event.preventDefault();
      openDownload(imageById(state.currentId));
    });
    els.zoomRange.addEventListener("input", () => setZoom(els.zoomRange.value));
    els.zoomIn.addEventListener("click", () => setZoom(state.zoom + .2));
    els.zoomOut.addEventListener("click", () => setZoom(state.zoom - .2));
    els.zoomReset.addEventListener("click", () => setZoom(1));
    els.lightbox.addEventListener("click", (event) => {
      if (event.target === els.lightbox) closeLightbox();
    });

    window.addEventListener("keydown", (event) => {
      if (!els.lightbox.classList.contains("open")) return;
      if (event.key === "Escape") closeLightbox();
      if (event.key === "ArrowLeft") moveLightbox(-1);
      if (event.key === "ArrowRight") moveLightbox(1);
      if (event.key === "+" || event.key === "=") setZoom(state.zoom + .2);
      if (event.key === "-") setZoom(state.zoom - .2);
    });

    applyQueryParams();
  </script>
</body>
</html>
